name: Build

on:
  push:
    branches:
      - master
    # 只有 package.json 变化（即版本号变更）才打包发版。
    # 日常提交、CI 同步更新元数据、同步上游的合并都不会再触发打包；
    # 需要重新打包时在 Actions 页面手动 Run workflow。
    paths:
      - 'package.json'
  workflow_dispatch:

# 给 GITHUB_TOKEN 显式开通需要的写权限，避免 fork 默认 read-only 导致创建 tag / 发 release 时 403
permissions:
  contents: write

# 同一个版本只允许一次打包：避免两次推送并行构建、后一次的产物覆盖前一次的 release
concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Packages
        env:
          DISABLE_SVG: 1
          KEYSTORE_STORE_FILE_BASE64: ${{ secrets.MASTER_KEYSTORE_STORE_FILE_BASE64 || secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEYSTORE_STORE_FILE: ${{ secrets.MASTER_KEYSTORE_STORE_FILE || secrets.KEYSTORE_STORE_FILE }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.MASTER_KEYSTORE_KEY_ALIAS || secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.MASTER_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.MASTER_KEYSTORE_KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          cd android
          echo "$KEYSTORE_STORE_FILE_BASE64" | base64 --decode > "app/$KEYSTORE_STORE_FILE"
          ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE="$KEYSTORE_STORE_FILE" -PMYAPP_UPLOAD_KEY_ALIAS="$KEYSTORE_KEY_ALIAS" -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD" -PMYAPP_UPLOAD_KEY_PASSWORD="$KEYSTORE_KEY_PASSWORD"
          rm -f "app/$KEYSTORE_STORE_FILE"

      # Push tag to GitHub if package.json version's tag is not tagged
      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Create git tag
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      # 构建与发布放在同一个 job 内完成，APK 直接在构建目录里上传到 Release，
      # 不再经过 upload-artifact，因此运行详情页不会出现 Artifacts 下载链接。
      - name: Generate release notes
        run: |
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          cd android/app/build/outputs/apk/release
          md5sum *.apk >> $GITHUB_WORKSPACE/publish/changeLog.md
          echo -e '```\n' >> $GITHUB_WORKSPACE/publish/changeLog.md
          echo -e '\n[软件安装包说明](https://lyswhut.github.io/lx-music-doc/download#%E8%BD%AF%E4%BB%B6%E5%AE%89%E8%A3%85%E5%8C%85%E8%AF%B4%E6%98%8E)\n' >> $GITHUB_WORKSPACE/publish/changeLog.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: false
          draft: false
          tag_name: v${{ env.PACKAGE_VERSION }}
          files: |
            android/app/build/outputs/apk/release/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk
            android/app/build/outputs/apk/release/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-armeabi-v7a.apk
            android/app/build/outputs/apk/release/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-x86_64.apk
            android/app/build/outputs/apk/release/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-x86.apk
            android/app/build/outputs/apk/release/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 更新检查读取的是 publish/version.json（不是 release / tag），
      # 发版后必须把它同步成新版本号，否则已安装的客户端永远收不到更新提示
      - name: Update update-metadata
        if: ${{ !contains(env.PACKAGE_VERSION, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 上一步把 MD5 追加到了 publish/changeLog.md，先还原成提交里的干净内容
          git checkout -- publish/changeLog.md
          node scripts/update-version-info.cjs
          if git diff --quiet -- publish/version.json; then
            echo "publish/version.json 无需更新"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/version.json
          git commit -m "chore: 同步更新元数据至 v${PACKAGE_VERSION}"
          git pull --rebase origin master
          git push origin HEAD:master

